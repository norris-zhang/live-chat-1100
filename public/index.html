<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main">
        <h1>Welcome to the live chat room</h1>
        <h3>What is your nickname?</h3>
        <div class="controls">
            <form action="/join" method="post" id="loginForm">
                <div><input type="text" name="nickname" autocomplete="off" autofocus id="nickname"></div>
                <div><button>Join</button></div>
            </form>
        </div>
        
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                /////// validation
                const nickname = document.getElementById('nickname').value;
                if (nickname.trim() === '') {
                    return;
                }
                if (await nicknameExists(nickname)) {
                    alert('Duplicate nickname, try another one.');
                    return;
                }
                e.target.submit();
            });
        });

        async function nicknameExists(nickname) {
            // 1. fetch server /nickname/exists
            const response = await fetch('/nickname-exists?n=' + encodeURIComponent(nickname));
            // 2. get response data
            const data = await response.json();
            // 3. return true or false
            return data.exists;
        }
    </script>
</body>
</html>
